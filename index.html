<script>

const vib=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const say=t=>$('live').textContent=t, stg=n=>$('stg').textContent='STAGE 0'+n;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const tick=()=>{const d=new Date();$('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})};tick();setInterval(tick,15000);

let ac,master,muted=false;
function audio(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();master=ac.createGain();master.gain.value=.22;master.connect(ac.destination)}if(ac.state==='suspended')ac.resume()}
function tone(f,t=0,d=.6,type='sine',v=.5){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),s=ac.currentTime+t;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(v,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(g);g.connect(master);o.start(s);o.stop(s+d+.05)}

function whoosh(){if(!ac||muted)return;const b=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;s.buffer=b;s.connect(f);f.connect(master);s.start()}
$('snd').onclick=()=>{muted=!muted;$('snd').textContent='SOUND: '+(muted?'OFF':'ON');vib(10)};

// particles
const cv=$('cv'),cx=cv.getContext('2d');let W,H,DPR=Math.min(devicePixelRatio||1,2);
const fit=()=>{W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)};fit();addEventListener('resize',fit);

const dust=[];for(let i=0;i<28;i++)dust.push({x:Math.random(),y:Math.random(),v:.00005+Math.random()*.0001});
function burst(x,y,n=90,sp=6){for(let i=0;i<n;i++){const a=Math.random()*6.283,s=Math.random()*sp;spawn(x,y,Math.cos(a)*s,Math.sin(a)*s,50+Math.random()*50,1+Math.random()*2,Math.random()<.7?'0,229,255':'255,255,255',.02)}}

let last=0;function loop(t){requestAnimationFrame(loop);if(document.hidden)return;cx.clearRect(0,0,W,H);

requestAnimationFrame(loop);
let lp;addEventListener('pointermove',e=>{if(e.pointerType==='mouse'&&!e.buttons&&Math.random()<.6)return;for(let i=0;i<3;i++)spawn(e.clientX,e.clientY,(Math.random()-.5)*1.6,(Math.random()-.5)*1.6,40,1+Math.random()*1.5,'0,229,255')},{passive:true});
addEventListener('pointerdown',e=>{for(let i=0;i<12;i++){const a=Math.random()*6.283;spawn(e.clientX,e.clientY,Math.cos(a)*2,Math.sin(a)*2,35,1.2,'255,255,255')}clearTimeout(lp);lp=setTimeout(()=>{burst(e.clientX,e.clientY,140,9);vib([20,30,40]);tone(220,0,.6,'sine',.3)},650)},{passive:true});
addEventListener('pointerup',()=>clearTimeout(lp));addEventListener('pointercancel',()=>clearTimeout(lp));

 const lines=[['> incoming transmission from the family...',''],['> decrypting...',''],['> signature verified','ok'],['> build birthday.exe ......... ok','ok'],['> deploying vlad@latest to production...',''],['> 200 OK','ok']];

  for(let i=0;i<=l.length;i++){if(!alive(id))return;d.textContent=l.slice(0,i);d.appendChild(cur);if(i%4==0)click();await wait(skip?0:22)}cur.remove();await wait(skip?0:380)}
 const cur=document.createElement('span');cur.className='cur';T.appendChild(cur);$('open').classList.add('show');$('open').focus({preventScroll:true});say('Transmission ready. Tap to open.')}

 const m=$('main');m.classList.remove('reveal','breathe');$('ring').classList.remove('draw');$('candle').className='candle';$('ctl').classList.remove('show');$('saved').classList.remove('show');$('sub').textContent='';

 m.classList.add('reveal');say('Happy Birthday, Vlad!');await wait(1400);if(!alive(id))return;
 $('candle').classList.add('show');m.classList.add('breathe');tone(880,0,.8,'sine',.2);await wait(500);$('sub').textContent='make a wish, Vladik ✦';$('ctl').classList.add('show');stg(2);say('Make a wish, then blow out the candle.')}

async function blowOut(){if(blown)return;blown=true;const id=run;if(micStop)micStop();$('candle').classList.add('out');$('main').classList.remove('breathe');$('ctl').classList.remove('show');

 await wait(700);$('saved').classList.add('show');for(let i=0;i<3;i++){await wait(350);if(!alive(id))return;$('saved').textContent='WISH SAVED TO CLOUD ☁'+' ·'.repeat(i+1)}
 await wait(1600);if(alive(id))level(id)}
$('candle').onclick=e=>{e.stopPropagation();blowOut()};$('blow').onclick=e=>{e.stopPropagation();blowOut()};
$('mic').onclick=async e=>{e.stopPropagation();audio();const b=$('mic');
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){b.textContent='MIC N/A — TAP INSTEAD';return}
 try{b.textContent='LISTENING...';const s=await navigator.mediaDevices.getUserMedia({audio:true});const src=ac.createMediaStreamSource(s),an=ac.createAnalyser();an.fftSize=512;src.connect(an);const buf=new Uint8Array(an.fftSize);let hits=0,on=true;
  micStop=()=>{on=false;s.getTracks().forEach(t=>t.stop());micStop=null};$('sub').textContent='blow now...';
